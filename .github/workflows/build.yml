name: Compilar App Papinhas (AAB Oficial)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Chave Fixa
        run: |
          keytool -genkeypair -alias papinhaKey -keyalg RSA -keysize 2048 -validity 10000 -keystore app/release.keystore -storepass "MinhaChave123@" -keypass "MinhaChave123@" -dname "CN=PapinhaEHistoria, OU=App, O=GooglePlay, L=SP, ST=SP, C=BR"

      - name: Gerar AAB Oficial (Play Store)
        run: gradle bundleRelease --stacktrace

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-aab-playstore
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
